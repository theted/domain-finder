# Lint, type-check, test and build the image for every pull request and push to master.
# Pushes to master then deploy to the shared EC2 box, but only once the checks pass.
#
# The deploy lives in theted/workflows: it SSHes in, checks out the triggering commit under
# /opt/domain-finder and rebuilds the compose stack in place. EC2_HOST, EC2_USER and EC2_SSH_KEY
# come from the repo's Actions secrets. The conventions it follows (port registry, deploy roots,
# nginx) are documented in the private theted/infrastructure repo.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Docker image builds
        run: docker build -t domain-finder .

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    uses: theted/workflows/.github/workflows/deploy-ec2.yml@master
    with:
      app-dir: /opt/domain-finder
    secrets: inherit
